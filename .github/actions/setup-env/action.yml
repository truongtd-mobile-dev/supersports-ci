name: Setup app env
description: >-
  Materialize the per-environment .env file (.env.stg / .env.live) into
  real-code/ by fetching it from Passbolt — the same source of truth local
  devs use via `yarn passbolt:stg|live` (scripts/passbolt-env.ts in the app
  repo). Passbolt is the ONLY source: there is deliberately no fallback, so a
  misconfigured secret fails the build loudly instead of silently building
  with a stale env. Requires node_modules (run the setup-js action first) —
  the fetch reuses the app repo's tsx script, so local and CI can never drift.

inputs:
  environment:
    description: staging or live.
    required: true
  passbolt-base-url:
    description: Passbolt server URL.
    required: true
  passbolt-user-id:
    description: Passbolt user id (uuid) owning the env resources.
    required: true
  passbolt-private-key:
    description: Armored OpenPGP private key of the Passbolt user.
    required: true
  passbolt-passphrase:
    description: Base64-encoded passphrase of the private key (same encoding as local .env.passbolt).
    required: true
  passbolt-resource-id-staging:
    description: Passbolt resource id holding the staging .env content.
    required: true
  passbolt-resource-id-production:
    description: Passbolt resource id holding the production .env content.
    required: true

runs:
  using: composite
  steps:
    - name: Fetch env from Passbolt
      shell: bash
      working-directory: real-code
      env:
        BUILD_ENV: ${{ inputs.environment }}
        PASSBOLT_BASE_URL: ${{ inputs.passbolt-base-url }}
        PASSBOLT_USER_ID: ${{ inputs.passbolt-user-id }}
        PASSBOLT_PRIVATE_KEY_ARMORED: ${{ inputs.passbolt-private-key }}
        PASSBOLT_PASSPHRASE: ${{ inputs.passbolt-passphrase }}
        PASSBOLT_RESOURCE_ID_STAGING: ${{ inputs.passbolt-resource-id-staging }}
        PASSBOLT_RESOURCE_ID_PRODUCTION: ${{ inputs.passbolt-resource-id-production }}
      run: |
        # `required: true` on composite-action inputs is advisory only —
        # enforce it for real so a missing secret fails with the actual cause.
        if [ -z "$PASSBOLT_BASE_URL" ] || [ -z "$PASSBOLT_USER_ID" ] || [ -z "$PASSBOLT_PRIVATE_KEY_ARMORED" ] || [ -z "$PASSBOLT_PASSPHRASE" ]; then
          echo "::error::PASSBOLT_* secrets are missing or empty — configure the repository secrets listed in the README (Secrets section)."
          exit 1
        fi
        # Workflows say staging|live; the script says staging|production.
        if [ "$BUILD_ENV" = "staging" ]; then ENV_NAME=staging; else ENV_NAME=production; fi
        yarn tsx scripts/passbolt-env.ts "$ENV_NAME"
        echo "Env for $BUILD_ENV fetched from Passbolt."
