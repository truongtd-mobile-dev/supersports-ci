name: Notify build failure
description: POST a notification (with a link back to this run) to the team webhook.

inputs:
  message:
    description: Human-readable message.
    required: true
  webhook-url:
    description: Notification webhook URL.
    required: true
  project-name:
    description: Project name included in the payload.
    required: true
  status:
    description: Numeric status code included in the payload (relay-specific; 1 = failure, 999 = informational).
    required: false
    default: "1"

runs:
  using: composite
  steps:
    - name: Notify failure
      shell: bash
      env:
        WEBHOOK_URL: ${{ inputs.webhook-url }}
        PROJECT_NAME: ${{ inputs.project-name }}
        ERROR_MSG: ${{ inputs.message }}
        STATUS: ${{ inputs.status }}
      run: |
        RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
        # Built with jq (not raw string interpolation) so a message containing
        # a quote or backslash can never break the JSON payload.
        PAYLOAD="$(jq -n \
          --arg project "$PROJECT_NAME" \
          --arg message "$ERROR_MSG" \
          --arg status "$STATUS" \
          --arg link "$RUN_URL" \
          '{project: $project, message: $message, status: ($status | tonumber), link: $link}')"
        curl -X POST \
          -H 'Content-Type: application/json' \
          -d "$PAYLOAD" \
          "$WEBHOOK_URL"
